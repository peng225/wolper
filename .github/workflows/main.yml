name: Main

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
    - '**.png'
  pull_request:
    branches: [ main ]
    paths-ignore:
    - '**.md'
    - '**.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: make

    - name: Test
      run: make test

    - name: Build image
      run: make image
